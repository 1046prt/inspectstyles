<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InspectStyles</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="top">
        <img src="../icons/InspectStyles.png" alt="" class="logo" />
        <div class="titles">
          <h1>InspectStyles</h1>
          <p id="status" class="status" role="status">Ready</p>
        </div>
      </header>

      <button id="toggle" class="launch" type="button">Start inspecting</button>
      <p id="error" class="error" role="alert" hidden></p>

      <section class="saved" aria-labelledby="saved-title">
        <div class="saved-head">
          <h2 id="saved-title">Saved colors</h2>
          <span id="saved-count" class="count"></span>
        </div>
        <div id="swatches" class="swatches"></div>
        <p id="saved-empty" class="hint">Pick colors with the eyedropper or the + button and they show up here.</p>
      </section>

      <footer class="foot">
        <span><kbd>Alt</kbd> <kbd>Shift</kbd> <kbd>I</kbd> toggle</span>
        <span><kbd>Esc</kbd> close</span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
